name: OCI MAX Ampere A1
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  create-ampere:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        
    - name: Install
      run: composer update --no-dev
      
    - name: OCI Auth
      run: |
        mkdir -p ~/.oci
        echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem
        
    - name: Capacity Check
      id: cap
      env:
        OCI_REGION: ${{ secrets.OCI_REGION }}
        OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
        OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
        OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
        OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      run: |
        echo "Checking ap-mumbai-1 A1.Flex..."
        if php check-capacity.php; then
          echo "cap=ok" >> $GITHUB_OUTPUT
          echo "✅ Capacity OK"
        else
          echo "cap=no" >> $GITHUB_OUTPUT
          echo "❌ No capacity - skipping"
        fi
        
    - name: Create Instance
      if: steps.cap.outputs.cap == 'ok'
      env:
        OCI_REGION: ${{ secrets.OCI_REGION }}
        OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
        OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
        OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
        OCI_PRIVATE_KEY_FILENAME: /home/runner/.oci/oci_api_key.pem
        OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
        OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
        OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
        OCI_SHAPE: VM.Standard.A1.Flex
        OCI_OCPUS: '4'
        OCI_MEMORY_IN_GBS: '24'
        OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      run: php index.php
      
    - name: Status Report
      if: always()
      run: echo "Complete. Check OCI Console ap-mumbai-1"
